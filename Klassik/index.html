<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Klassik</title>
<link rel="stylesheet" href="../style.css">
</head>

<body>

<h1>Klassik</h1>

<h2>Alle Songs</h2>

<ul class="songlist">
    <li data-file="Klassik-Song1.mp3">Klassik-Song 1</li>
    <li data-file="Klassik-Song2.mp3">Klassik-Song 2</li>
    <li data-file="Klassik-Song3.mp3">Klassik-Song 3</li>
    <!-- hier einfach deine echten Dateien eintragen -->
</ul>

<script>
document.querySelectorAll('.songlist li').forEach(item => {
    item.addEventListener('click', () => {
        const file = item.getAttribute('data-file');
        window.location.href = file;
    });
});
</script>

</body>
</html>
