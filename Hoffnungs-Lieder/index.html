<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Hoffnungs-Lieder</title>
<link rel="stylesheet" href="../style.css">
</head>

<body>

<h1>Hoffnungs-Lieder</h1>

<h2>Alle Songs</h2>

<ul class="songlist">
    <li data-file="Alles was ich bin.mp3">Alles was ich bin</li>
    <li data-file="Babylon du große Stadt.mp3">Babylon du große Stadt</li>
    <li data-file="Dein Geist berührt mich.mp3">Dein Geist berührt mich</li>
    <li data-file="Die Neue Welt.mp3">Die Neue Welt</li>
    <li data-file="Die Wahrheit brennt_F, Remake.mp3">Die Wahrheit brennt (F, Remake)</li>
    <li data-file="Die Wahrheit brennt_M.mp3">Die Wahrheit brennt (M)</li>
    <li data-file="Du darfst das verstehn.mp3">Du darfst das verstehn</li>
    <li data-file="Du gibst Hoffnung.mp3">Du gibst Hoffnung</li>
    <li data-file="Durch deinen Sohn.mp3">Durch deinen Sohn</li>
</ul>

<script>
document.querySelectorAll('.songlist li').forEach(item => {
    item.addEventListener('click', () => {
        const file = item.getAttribute('data-file');
        window.location.href = file;
    });
});
</script>

</body>
</html>
