<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Hoffnungs‑Lieder</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
    }

    /* Sidebar */
    .sidebar {
        width: 220px;
        background: linear-gradient(180deg, #222, #111);
        color: white;
        height: 100vh;
        padding: 25px 15px;
        position: fixed;
        top: 0;
        left: 0;
        box-shadow: 3px 0 10px rgba(0,0,0,0.3);
    }

    .sidebar h2 {
        font-size: 20px;
        margin-bottom: 20px;
        text-align: center;
        letter-spacing: 1px;
    }

    .sidebar a {
        display: flex;
        align-items: center;
        gap: 10px;
        color: white;
        text-decoration: none;
        padding: 10px;
        margin-bottom: 10px;
        background: #333;
        border-radius: 6px;
        font-size: 15px;
        transition: 0.2s;
    }

    .sidebar a:hover {
        background: #444;
        transform: translateX(4px);
    }

    /* Icons */
    .icon {
        font-size: 18px;
    }

    /* Content */
    .content {
        margin-left: 240px;
        padding: 25px;
        width: calc(100% - 240px);
    }

    h1 {
        margin-top: 0;
        margin-bottom: 15px;
        font-size: 26px;
        color: #222;
    }

    p {
        margin-bottom: 20px;
        font-size: 15px;
        color: #444;
    }

    /* MP3 Grid */
    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        max-width: 1000px;
    }

    .song {
        background: white;
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 0 6px rgba(0,0,0,0.1);
        transition: 0.2s;
    }

    .song:hover {
        transform: scale(1.02);
    }

    .song strong {
        font-size: 15px;
        display: block;
        margin-bottom: 6px;
        color: #222;
    }

    audio {
        width: 100%;
        height: 32px;
    }

    @media (max-width: 700px) {
        body {
            flex-direction: column;
        }
        .sidebar {
            width: 100%;
            height: auto;
            position: relative;
        }
        .content {
            margin-left: 0;
            width: 100%;
        }
        .grid {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<div class="sidebar">
    <h2>Navigation</h2>

    <a href="../index.html">
