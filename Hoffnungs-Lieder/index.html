<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Hoffnungs‑Lieder – Spotify‑Style</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    color: #222;
    margin-bottom: 20px;
}

/* Player-Design */
.player {
    display: flex;
    align-items: center;
    gap: 15px;
    background: #fff;
    padding: 12px;
    border-radius: 12px;
    box-shadow: 0 0 8px rgba(0,0,0,0.1);
    margin-bottom: 12px;
}

.cover {
    width: 60px;
    height: 60px;
    border-radius: 8px;
    object-fit: cover;
}

.controls {
    display: flex;
    align-items: center;
    gap: 15px;
}

.progress-ring {
    position: relative;
    width: 60px;
    height: 60px;
    cursor: pointer;
}

.progress-ring svg {
    position: absolute;
    top: 0;
    left: 0;
}

circle.bg {
    fill: none;
    stroke: #ddd;
    stroke-width: 4;
}

circle.progress {
    fill: none;
    stroke: #1db954; /* Spotify-Grün */
    stroke-width: 4;
    stroke-dasharray: 163;
    stroke-dashoffset: 163;
    transition: stroke-dashoffset 0.1s linear;
}

.play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 22px;
    font-weight: bold;
    color: #1db954;
}

.title {
    font-size: 15px;
    color: #222;
}
</style>
</head>

<body>
<h1>Hoffnungs‑Lieder</h1>

<!-- PLAYER 1 -->
<div class="player">
    <img src="cover.jpg" class="cover">
    <div class="controls">
        <div class="progress-ring">
            <svg width="60" height="60">
                <circle class="bg" cx="30" cy="30" r="26"></circle>
                <circle class="progress" cx="30" cy="30" r="26"></circle>
            </svg>
            <div class="play-btn">▶</div>
        </div>
        <div class="title">Alles was ich bin</div>
    </div>
    <audio src="Alles was ich bin.mp3"></audio>
</div>

<!-- PLAYER 2 -->
<div class="player">
    <img src="cover.jpg" class="cover">
    <div class="controls">
        <div class="progress-ring">
            <svg width="60" height="60">
                <circle class="bg" cx="30" cy="30" r="26"></circle>
                <circle class="progress" cx="30" cy="30" r="26"></circle>
            </svg>
            <div class="play-btn">▶</div>
        </div>
        <div class="title">Babylon du große Stadt</div>
    </div>
    <audio src="Babylon du große Stadt.mp3"></audio>
</div>

<script>
document.querySelectorAll('.player').forEach(player => {
    const audio = player.querySelector('audio');
    const ring = player.querySelector('.progress');
    const playBtn = player.querySelector('.play-btn');

    playBtn.addEventListener('click', () => {
        if (audio.paused) {
            audio.play();
            playBtn.textContent = "❚❚";
        } else {
            audio.pause();
            playBtn.textContent = "▶";
        }
    });

    audio.addEventListener('timeupdate', () => {
        const progress = audio.currentTime / audio.duration;
        ring.style.strokeDashoffset = 163 - (163 * progress);
    });

    audio.addEventListener('ended', () => {
        playBtn.textContent = "▶";
        ring.style.strokeDashoffset = 163;
    });
});
</script>

</body>
</html>
