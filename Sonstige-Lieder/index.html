<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Sonstige Lieder</title>
    <link rel="stylesheet" href="../style.css">
</head>

<!-- ============================================
   3. BODY-START + Seitenklasse
   ============================================ -->
<body class="sonstige">

</header>

<!-- ============================================

<nav class="main-nav">
    <ul>
        <li><a href="../index.html">Startseite</a></li>
        <li><a href="../Hoffnungs-Lieder/index.html">Hoffnungs‑Lieder</a></li>

<!-- ============================================
   6. SEITENTITEL
   ============================================ -->
<h1>Sonstige Lieder</h1>
<h2>Alle Songs</h2>

<!-- ============================================
   7. SONG-LISTE MIT "neu"-System
   ============================================ -->
<ul class="songlist">

    <li data-date="2026-09-01" data-file="Song1.mp3">
        Song 1
    </li>

    <li data-date="2026-09-05" data-file="Song2.mp3">
        Song 2
    </li>

    <li data-date="2026-09-10" data-file="Song3.mp3">
        Song 3
    </li>

</ul>

<!-- ============================================
   8. FOOTER
   ============================================ -->
<footer>
    <div class="footer-left">
        <p class="footer-copy">© 2026 Rocco & Chantal</p>
    </div>
</footer>

<!-- ============================================
   9. JS: Klick auf Song + "neu"-Anzeige
   ============================================ -->
<script>
document.querySelectorAll('.songlist li').forEach(item => {
    item.addEventListener('click', () => {
        const file = item.getAttribute('data-file');
        window.location.href = file;
    });
});
</script>

<script src="../neu.js"></script>

</body>
</html>
